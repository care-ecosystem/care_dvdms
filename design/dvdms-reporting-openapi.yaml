openapi: 3.0.3
info:
  title: CARE DVDMS Reporting APIs
  description: |
    Read-only reporting endpoints exposing facility and inventory data for
    eAushadhi/DVDMS reconciliation.
  version: 1.0.0
  contact:
    name: Jagankumar E
    email: jagan.kumar@egov.org.in

servers:
  - url: https://analytics-care-k3s.digit.org
    description: Reporting server (Egov)

tags:
  - name: Facility Information
    description: Facility master data - IDs needed as parameters for the other reports
  - name: Active DDC Count
    description: Active DDC counts within a facility
  - name: Active DDC Item Issue
    description: Item-level issue details for active DDCs, per facility per day
  - name: Issue and Consumption
    description: Issue vs consumption, per drug, per store, within a facility, per day

security:
  - ApiKeyAuth: []

paths:
  /api/card/79/query/json:
    post:
      tags:
        - Facility Information
      summary: Facility Information
      description: |
        Returns facility id, name, and geo organization for eAushadhi/DVDMS
        facility master reconciliation.
      operationId: getFacilityInformation
      responses:
        '200':
          description: Facility information retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacilityInformation'
              example:
                - Facility ID: "6cf17f1f-706d-43e3-bd62-e5de6a30f0dc"
                  Facility Name: "Health Centre A"
                  Geo Organization: "Karnataka"
                - Facility ID: "cdebbb76-50fb-4fbd-85e3-4bdfb185d5da"
                  Facility Name: "Apollo Hospitals"
                  Geo Organization: "Karnataka"
        '401':
          description: Unauthenticated - missing or invalid x-api-key
          content:
            text/plain:
              schema:
                type: string
              example: "Unauthenticated"

  /api/card/75/query/json:
    post:
      tags:
        - Active DDC Count
      summary: Facility DDC Summary
      description: |
        Returns DDC counts for a facility - total, active, and inactive.
      operationId: getFacilityDdcSummary
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: string
                  description: |
                    JSON-encoded array (JSON.stringify the array below) with
                    a single filter entry for facility_id. The `id` and
                    `target` values are fixed and must be sent exactly as
                    shown; only `value` (the facility UUID) changes per
                    request.

                    Decoded shape:
                    ```json
                    [
                      {
                        "id": "353403c0-7a0d-4e5a-8888-ab8851c5371a",
                        "type": "string/=",
                        "value": ["<facility_id_uuid>"],
                        "target": ["variable", ["template-tag", "facility_id"]]
                      }
                    ]
                    ```
                  example: >-
                    [{"id":"353403c0-7a0d-4e5a-8888-ab8851c5371a","type":"string/=","value":["cdebbb76-50fb-4fbd-85e3-4bdfb185d5da"],"target":["variable",["template-tag","facility_id"]]}]
      responses:
        '200':
          description: Facility DDC summary retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacilityDdcSummary'
              example:
                - facilityCode: "****-****-****-d5da"
                  facilityName: "Apollo Hospitals"
                  totalDDCCount: 3
                  activeDDCCount: 3
                  inactiveDDCCount: 0
        '401':
          description: Unauthenticated - missing or invalid x-api-key
          content:
            text/plain:
              schema:
                type: string
              example: "Unauthenticated"

  /api/card/77/query/json:
    post:
      tags:
        - Active DDC Item Issue
      summary: Active DDC Item Issue
      description: |
        Returns item-level issue details for a facility on a given date -
        one row per dispensed item, for eAushadhi/DVDMS issue-history
        reconciliation.
      operationId: getActiveDdcItemIssue
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: string
                  description: |
                    JSON-encoded array (JSON.stringify the array below) with
                    two filter entries - facility_id and issue_date. The
                    `id` and `target` values are fixed and must be sent
                    exactly as shown; only the `value` of each entry (the
                    facility UUID and the issue date) changes per request.

                    Decoded shape:
                    ```json
                    [
                      {
                        "id": "c0a2a13c-5065-45e4-97f3-d92165577a86",
                        "type": "string/=",
                        "value": ["<facility_id_uuid>"],
                        "target": ["variable", ["template-tag", "facility_id"]]
                      },
                      {
                        "id": "5ceb4334-212c-4711-b3c4-a48b637adb9f",
                        "type": "string/=",
                        "value": ["<issue_date in YYYY-MM-DD, e.g. 2026-10-06>"],
                        "target": ["variable", ["template-tag", "issue_date"]]
                      }
                    ]
                    ```
                  example: >-
                    [{"id":"c0a2a13c-5065-45e4-97f3-d92165577a86","type":"string/=","value":["cdebbb76-50fb-4fbd-85e3-4bdfb185d5da"],"target":["variable",["template-tag","facility_id"]]},{"id":"5ceb4334-212c-4711-b3c4-a48b637adb9f","type":"string/=","value":["2026-10-06"],"target":["variable",["template-tag","issue_date"]]}]
      responses:
        '200':
          description: Active DDC item issue details retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveDdcItemIssue'
              example:
                - STORE_NAME: "Main Store"
                  HSTNUM_ISSUE_NO: "10322609000030"
                  HSTNUM_ITEM_ID: "10000237"
                  HSTNUM_ITEMBRAND_ID: "10000237"
                  HSTSTR_BATCH_SL_NO: "MOCK-BATCH"
                  HSTNUM_ISSUE_QTY: 2.0
                  HSTDT_EXPIRY_DATE: "2027-09-18"
                  HRGNUM_PUK: "b7d3e9a1-2f4c-4a6e-9c8d-5e1f7a3b2c64"
        '401':
          description: Unauthenticated - missing or invalid x-api-key
          content:
            text/plain:
              schema:
                type: string
              example: "Unauthenticated"

  /api/card/78/query/json:
    post:
      tags:
        - Issue and Consumption
      summary: Issue and Consumption
      description: |
        Returns issued vs. consumed quantities, per drug batch per store
        movement, for a facility on a given date - for stock reconciliation.
      operationId: getIssueAndConsumption
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: string
                  description: |
                    JSON-encoded array (JSON.stringify the array below) with
                    two filter entries - facility_id and issue_date. The
                    `id` and `target` values are fixed and must be sent
                    exactly as shown; only the `value` of each entry (the
                    facility UUID and the issue date) changes per request.

                    Decoded shape:
                    ```json
                    [
                      {
                        "id": "d9c87cae-0cb5-478e-9040-ddfe4c32f4f2",
                        "type": "string/=",
                        "value": ["<facility_id_uuid>"],
                        "target": ["variable", ["template-tag", "facility_id"]]
                      },
                      {
                        "id": "0c102071-d5a6-46b7-8a13-7ccfa3703ecd",
                        "type": "string/=",
                        "value": ["<issue_date in YYYY-MM-DD, e.g. 2026-09-23>"],
                        "target": ["variable", ["template-tag", "issue_date"]]
                      }
                    ]
                    ```
                  example: >-
                    [{"id":"d9c87cae-0cb5-478e-9040-ddfe4c32f4f2","type":"string/=","value":["cdebbb76-50fb-4fbd-85e3-4bdfb185d5da"],"target":["variable",["template-tag","facility_id"]]},{"id":"0c102071-d5a6-46b7-8a13-7ccfa3703ecd","type":"string/=","value":["2026-09-23"],"target":["variable",["template-tag","issue_date"]]}]
      responses:
        '200':
          description: Issue and consumption details retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueAndConsumption'
              example:
                - from_store: "-"
                  to_store: "Main Store"
                  drug_id: "10000237"
                  drug_name: "Paracetamol 150 Mg / Ml"
                  batch_number: "MOCK-BATCH"
                  expiry_date: "2027-09-18"
                  issue_no: "10322609000030"
                  metric_date: "2026-09-23"
                  total_quantity_issued: 0
                  total_quantity_consumed: 112.0
        '401':
          description: Unauthenticated - missing or invalid x-api-key
          content:
            text/plain:
              schema:
                type: string
              example: "Unauthenticated"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key issued for the reporting server

  schemas:
    FacilityInformation:
      type: object
      required:
        - Facility ID
        - Facility Name
        - Geo Organization
      properties:
        Facility ID:
          type: string
          format: uuid
          example: "6cf17f1f-706d-43e3-bd62-e5de6a30f0dc"
        Facility Name:
          type: string
          example: "Health Centre A"
        Geo Organization:
          type: string
          example: "Karnataka"

    FacilityDdcSummary:
      type: object
      required:
        - facilityCode
        - facilityName
        - totalDDCCount
        - activeDDCCount
        - inactiveDDCCount
      properties:
        facilityCode:
          type: string
          description: Masked facility identifier (last 4 characters of the facility UUID visible)
          example: "****-****-****-d5da"
        facilityName:
          type: string
          example: "Apollo Hospitals"
        totalDDCCount:
          type: integer
          example: 3
        activeDDCCount:
          type: integer
          example: 3
        inactiveDDCCount:
          type: integer
          example: 0

    ActiveDdcItemIssue:
      type: object
      required:
        - STORE_NAME
        - HSTNUM_ISSUE_NO
        - HSTNUM_ITEM_ID
        - HSTNUM_ISSUE_QTY
        - HRGNUM_PUK
      properties:
        STORE_NAME:
          type: string
          description: Pharmacy store name
          example: "Main Store"
        HSTNUM_ISSUE_NO:
          type: string
          description: Issue Number
          example: "10322609000030"
        HSTNUM_ITEM_ID:
          type: string
          description: Item ID
          example: "10000237"
        HSTNUM_ITEMBRAND_ID:
          type: string
          nullable: true
          description: Item Brand ID
          example: "10000237"
        HSTSTR_BATCH_SL_NO:
          type: string
          nullable: true
          description: Batch Number
          example: "MOCK-BATCH"
        HSTNUM_ISSUE_QTY:
          type: number
          description: Quantity Issued
          example: 2.0
        HSTDT_EXPIRY_DATE:
          type: string
          format: date
          nullable: true
          description: Expiry Date
          example: "2027-09-18"
        HRGNUM_PUK:
          type: string
          format: uuid
          description: Patient Unique Key
          example: "b7d3e9a1-2f4c-4a6e-9c8d-5e1f7a3b2c64"

    IssueAndConsumption:
      type: object
      required:
        - from_store
        - to_store
        - drug_id
        - drug_name
        - batch_number
        - expiry_date
        - issue_no
        - metric_date
        - total_quantity_issued
        - total_quantity_consumed
      properties:
        from_store:
          type: string
          description: Source store name; "-" when there is no source store
          example: "-"
        to_store:
          type: string
          description: Destination pharmacy store name
          example: "Main Store"
        drug_id:
          type: string
          description: Drug/item ID
          example: "10000237"
        drug_name:
          type: string
          description: Drug/item name
          example: "Paracetamol 150 Mg / Ml"
        batch_number:
          type: string
          description: Batch Number
          example: "MOCK-BATCH"
        expiry_date:
          type: string
          format: date
          description: Expiry Date
          example: "2027-09-18"
        issue_no:
          type: string
          description: Issue Number
          example: "10322609000030"
        metric_date:
          type: string
          format: date
          example: "2026-09-23"
        total_quantity_issued:
          type: number
          description: Total quantity received into the store on this date
          example: 0
        total_quantity_consumed:
          type: number
          description: Total quantity dispensed from the store on this date
          example: 112.0
