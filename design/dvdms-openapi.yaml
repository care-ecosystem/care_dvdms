          $ref: '#/components/schemas/DrugInfo'

    RecordItemOrder:
      allOf:
        - $ref: '#/components/schemas/RecordItemOrderCreate'
        - type: object
          required:
            - id
            - institute_id
            - created_by
            - created_date
            - modified_date
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Record item order external_id
              example: "uuid"
            record_order:
              allOf:
                - $ref: '#/components/schemas/RecordOrder'
              readOnly: true
              description: Record order details (expanded in response)
            supply_request:
              allOf:
                - $ref: '#/components/schemas/SupplyRequestSummary'
              readOnly: true
              description: Supply request details (expanded in response)
            institute_id:
              type: string
              format: uuid
              readOnly: true
              description: FK to institute
              example: "uuid"
            created_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              readOnly: true
            updated_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              nullable: true
              readOnly: true
            created_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"
            modified_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"

    # Error Schema
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Institute already exists for this facility"
        code:
          type: string
          description: Machine-readable error code
          example: "MAPPING_EXISTS"
        details:
          type: object
          nullable: true
          description: Field-level validation errors
          example:
            eaushadhi_institute_id: ["This field is required"]

  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid input parameters"
            code: "INVALID_INPUT"
            details:
              eaushadhi_institute_id: ["This field is required"]

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Authentication credentials were not provided"
            code: "UNAUTHORIZED"

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Resource not found"
            code: "NOT_FOUND"

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error occurred"
            code: "INTERNAL_ERROR"
