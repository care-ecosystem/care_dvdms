        - status
      properties:
        id:
          type: string
          format: uuid
          example: "2e1cb879-8101-4160-b324-bc97e07c35f3"
        item:
          $ref: '#/components/schemas/ItemSummary'
        order:
          $ref: '#/components/schemas/OrderSummary'
        quantity:
          type: string
          example: "16.000000"
        status:
          type: string
          example: "active"

    DrugInfo:
      type: object
