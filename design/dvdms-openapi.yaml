        - supply_request
        - drug
      properties:
        record_order:
          type: string
          format: uuid
          description: Reference to record order UUID
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        supply_request:
          type: string
          format: uuid
          description: Supply request UUID
          example: "2e1cb879-8101-4160-b324-bc97e07c35f3"
