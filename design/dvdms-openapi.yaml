    # ===================== Record Order Schemas =====================
    RecordOrderCreate:
      type: object
      required:
        - name
        - institute
        - order
        - institute_store
        - institute_supplier
        - status
      properties:
        name:
          type: string
          description: Record order name
          example: "eaushadhi"
        institute:
          type: string
          format: uuid
          description: Institute UUID
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        order:
          type: string
          format: uuid
          description: Reference to CARE order external_id
          example: "61808cc9-4c50-4eda-9803-0e914b23f342"
        institute_store:
          type: string
          format: uuid
          description: Institute store mapping UUID
          example: "c2f8d3b5-ae90-4f7c-b401-8e3c9d6f1b25"
        institute_supplier:
          type: string
          format: uuid
          description: Institute supplier mapping UUID
          example: "b1e7c2a4-9d8f-4e6b-a3c1-7f2d8e5b9c34"
        status:
          type: string
          enum: [draft, pending, approved, rejected, completed]
          description: Order status
          example: "draft"

    RecordOrder:
      allOf:
        - $ref: '#/components/schemas/RecordOrderCreate'
        - type: object
          required:
            - id
            - created_by
            - created_date
            - modified_date
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Record order external_id
              example: "uuid"
            institute:
              allOf:
                - $ref: '#/components/schemas/InstituteSummary'
              readOnly: true
              description: Institute details (expanded in response)
            order:
              allOf:
                - $ref: '#/components/schemas/OrderSummary'
              readOnly: true
              description: Order details (expanded in response)
            institute_store:
              allOf:
                - $ref: '#/components/schemas/InstituteStoreSummary'
              readOnly: true
              description: Institute store mapping details (expanded in response)
            institute_supplier:
              allOf:
                - $ref: '#/components/schemas/InstituteSupplierSummary'
              readOnly: true
              description: Institute supplier mapping details (expanded in response)
            created_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              readOnly: true
            updated_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              nullable: true
              readOnly: true
            created_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"
            modified_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"

    # ===================== DVDMS Outwards Record Schemas =====================
    DvdmsOutwardsRecord:
      type: object
      required:
        - id
        - record_order
        - status
        - created_date
        - modified_date
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Outwards record external_id
          example: "outwards-uuid-1"
        record_order:
          type: string
          format: uuid
          description: Reference to record order UUID
          example: "uuid1"
        eaushadhi_indent_no:
          type: string
          nullable: true
          description: eAushadhi/DVDMS indent number
          example: "IND-2026-001234"
        status:
          type: string
          enum: [created, submitted, cancelled]
          description: |
            Outwards record status:
            - created: Indent created in DVDMS
            - submitted: Indent submitted for processing
            - cancelled: Indent cancelled
          example: "created"
        eaushadhi_indent_status:
          type: string
          nullable: true
          enum: [draft, submitted, received, processing, processed, partially_issued, issued, cancelled]
          description: |
            Current indent status in eAushadhi/DVDMS system:
            - draft: Indent created but not submitted
            - submitted: Indent submitted to warehouse
            - received: Warehouse acknowledged receipt
            - processing: Warehouse is processing the indent
            - processed: Indent fully processed
            - partially_issued: Some items issued
            - issued: All items issued
            - cancelled: Indent was cancelled
          example: "partially_issued"
        sync_log_id:
          type: string
          nullable: true
          description: Sync log identifier for tracking DVDMS sync operations
          example: "sync-log-123"
        created_by:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        updated_by:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-19 19:29:35.868682+05:30"
        modified_date:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-21 09:05:00.000000+05:30"

    # ===================== DVDMS Inwards Record Schemas =====================
    DvdmsInwardsRecord:
      type: object
      required:
        - id
        - eaushadhi_issue_no
        - created_at
        - eaushadhi_issue_status
        - outward_record
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Inwards record external_id
          example: "issue-uuid-1"
        eaushadhi_issue_no:
          type: string
          description: eAushadhi/DVDMS issue number
          example: "ISS-2026-005678"
        created_at:
          type: string
          format: date-time
          description: Inwards record creation timestamp
          example: "2026-05-20 10:30:00.000000+05:30"
        eaushadhi_issue_status:
          type: string
          enum: [draft, pending, received, partially_received, completed, cancelled]
          description: |
            Current issue status in eAushadhi/DVDMS system:
            - draft: Issue created but not submitted
            - pending: Issue submitted, awaiting receipt
            - received: Issue received at destination
            - partially_received: Some items received
            - completed: All items received
            - cancelled: Issue cancelled
          example: "received"
        outward_record:
          type: string
          format: uuid
          description: Reference to outward record UUID
          example: "outwards-uuid-1"
        eaushadhi_indent_no:
          type: string
          nullable: true
          description: eAushadhi/DVDMS indent number
          example: "IND-2026-001234"
        sync_log_id:
          type: string
          nullable: true
          description: Sync log identifier for tracking DVDMS sync operations
          example: "sync-log-456"

    # ===================== DVDMS Indent Status History Schemas =====================
    DvdmsIndentStatusHistory:
      type: object
      required:
        - id
        - outwards_record
        - indent_status
        - checked_at
        - created_date
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Status history entry external_id
          example: "status-history-uuid-1"
        outwards_record:
          type: string
          format: uuid
          description: Reference to outwards record UUID
          example: "outwards-uuid-1"
        indent_status:
          type: string
          enum: [draft, submitted, received, processing, processed, cancelled]
          description: |
            Indent status at this point in time:
            - draft: Indent created but not submitted
            - submitted: Indent submitted to warehouse
            - received: Warehouse acknowledged receipt
            - processing: Warehouse is processing the indent
            - processed: Indent fully processed and items dispatched
            - cancelled: Indent was cancelled
          example: "received"
        status_details:
          type: object
          nullable: true
          description: Raw response from DVDMS status check API
          example:
            indent_id: "IND-2026-001234"
            current_status: "received"
            warehouse_name: "Bokaro DWH"
            received_date: "2026-05-19 19:45:00"
            received_by: "Warehouse Manager"
        checked_at:
          type: string
          format: date-time
          description: Timestamp when status was checked from DVDMS
          example: "2026-05-19 19:50:00.000000+05:30"
        created_by:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: User who triggered the status check
        created_date:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-19 19:50:00.000000+05:30"

    # ===================== Record Item Order Schemas =====================
    # Shared item object used in supply requests
    ItemSummary:
