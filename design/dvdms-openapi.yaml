openapi: 3.0.3
info:
  title: DVDMS Integration Plugin - Institute API
  description: |
    API specification for managing facility-to-DVDMS institutes.

    Each CARE facility can have exactly ONE institute (UNIQUE on facility_id).
    The institute establishes the connection between CARE and the DVDMS system.
  version: 1.0.0
  contact:
    name: Jagankumar E
    email: jagan.kumar@egov.org.in

servers:
  - url: https://care.ohc.network/api/care_dvdms
    description: Dev server
  - url: https://care-k3s.digit.org/api/care_dvdms
    description: Egov server

tags:
  - name: Institutes
    description: Manage facility to DVDMS institutes
  - name: Supplier Mappings
    description: Manage supplier (warehouse) mappings for institutes
  - name: Store Mappings
    description: Manage store mappings for institutes
  - name: DVDMS Lookups
    description: Lookup data directly from DVDMS system (warehouses, stores, etc.)
  - name: Record Orders
    description: Manage DVDMS record orders (indents/requisitions)
  - name: Record Item Orders
    description: Manage individual items in DVDMS record orders
  - name: DVDMS Outwards Record
    description: Manage outwards records for DVDMS indent creation and sync status

security:
  - BearerAuth: []

paths:
  /facility/{facility_external_id}/institute/:
    post:
      tags:
        - Institutes
      summary: Create institute for a facility
      description: |
        Create a mapping between a CARE facility and DVDMS institute.
        A facility can have only one institute (UNIQUE on facility_external_id).

        **Note:** facility_external_id is in the URL, so it's automatically set from the path parameter.
      operationId: createInstitute
      parameters:
        - name: facility_external_id
          in: path
          required: true
          description: CARE facility external_id (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteCreate'
            example:
              eaushadhi_institute_id: "000931"
              eaushadhi_user_ref_id: "14462"
              eaushadhi_institute_name: "Ranchi DH"
              schema_version: "1.0"
      responses:
        '201':
          description: Institute created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                facility_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                eaushadhi_institute_id: "000931"
                eaushadhi_user_ref_id: "14462"
                eaushadhi_institute_name: "Ranchi DH"
                schema_version: "1.0"
                meta: null
                created_by:
                  id: "uuid"
                  username: "admin"
                  first_name: "Admin"
                  last_name: "User"
                  email: "admin@example.com"
                updated_by: null
                created_date: "2026-05-19 19:29:35.868682+05:30"
                modified_date: "2026-05-19 19:29:35.868682+05:30"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflict - this facility already has a mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Institute already exists for this facility"
                code: "MAPPING_EXISTS"
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Institutes
      summary: Get institute for a facility
      description: |
        Retrieve the institute for a specific facility.
        Returns 404 if no mapping exists.
      operationId: getInstitute
      parameters:
        - name: facility_external_id
          in: path
          required: true
          description: CARE facility external_id (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Institute details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                facility_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                eaushadhi_institute_id: "000931"
                eaushadhi_user_ref_id: "14462"
                eaushadhi_institute_name: "Ranchi DH"
                schema_version: "1.0"
                meta: null
                created_by:
                  id: "uuid"
                  username: "admin"
                  first_name: "Admin"
                  last_name: "User"
                  email: "admin@example.com"
                updated_by: null
                created_date: "2026-05-19 19:29:35.868682+05:30"
                modified_date: "2026-05-19 19:29:35.868682+05:30"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No institute found for this facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "No institute found for this facility"
                code: "MAPPING_NOT_FOUND"
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Institutes
      summary: Update institute for a facility
      description: |
        Update the institute for a specific facility.
        All fields are optional; only supplied fields are updated.
      operationId: updateInstitute
      parameters:
        - name: facility_external_id
          in: path
          required: true
          description: CARE facility external_id (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteUpdate'
            examples:
              update_user_reference:
                summary: Update user reference ID
                value:
                  eaushadhi_user_ref_id: "14463"
              update_schema_version:
                summary: Update schema version
                value:
                  schema_version: "2.0"
              update_multiple:
                summary: Update multiple fields
                value:
                  eaushadhi_user_ref_id: "14464"
                  schema_version: "2.0"
                  meta:
                    last_sync: "2026-05-20T10:30:00Z"
                    notes: "Updated after migration"
      responses:
        '200':
          description: Institute updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institute'
              example:
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                facility_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                eaushadhi_institute_id: "000931"
                eaushadhi_user_ref_id: "14464"
                eaushadhi_institute_name: "Ranchi DH"
                schema_version: "2.0"
                meta:
                  last_sync: "2026-05-20T10:30:00Z"
                  notes: "Updated after migration"
                created_by:
                  id: "uuid"
                  username: "admin"
                  first_name: "Admin"
                  last_name: "User"
                  email: "admin@example.com"
                updated_by:
                  id: "uuid2"
                  username: "updater"
                  first_name: "Update"
                  last_name: "User"
                  email: "updater@example.com"
                created_date: "2026-05-19 19:29:35.868682+05:30"
                modified_date: "2026-05-20 10:35:22.123456+05:30"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No institute found for this facility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "No institute found for this facility"
                code: "MAPPING_NOT_FOUND"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- Supplier Mappings ----------
  /facility/{facility_external_id}/institute/{institute_id}/suppliers/:
    post:
      tags:
        - Supplier Mappings
      summary: Add a supplier mapping
      description: |
        Add a supplier (warehouse) mapping to the institute.
        Maps a CARE supplier to a DVDMS warehouse name for inward matching.
        At most one supplier can be marked as default.
      operationId: createSupplierMapping
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierMappingCreate'
            example:
              supplier: "b1e7c2a4-9d8f-4e6b-a3c1-7f2d8e5b9c34"
              eaushadhi_warehouse_id: "99901000"
              eaushadhi_warehouse_name: "Bokaro_DWH"
              is_default: true
      responses:
        '201':
          description: Supplier mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierMapping'
              example:
                id: "uuid1"
                supplier:
                  id: "b1e7c2a4-9d8f-4e6b-a3c1-7f2d8e5b9c34"
                  name: "Medplus"
                  org_type: "product_supplier"
                eaushadhi_warehouse_id: "99901000"
                eaushadhi_warehouse_name: "Bokaro_DWH"
                is_default: true
                institute_id: "uuid"
                created_by:
                  id: "uuid"
                  username: "admin"
                  first_name: "Admin"
                  last_name: "User"
                  email: "admin@example.com"
                updated_by: null
                created_date: "2026-05-19 19:29:35.868682+05:30"
                modified_date: "2026-05-19 19:29:35.868682+05:30"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - supplier already mapped or multiple defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Supplier Mappings
      summary: List supplier mappings
      description: Get all supplier mappings for this institute
      operationId: listSupplierMappings
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of supplier mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierMapping'
              example:
                count: 2
                results:
                  - id: "uuid1"
                    supplier:
                      id: "5aa85d4e-3456-41fb-aee2-8076f07cb91b"
                      name: "Medplus"
                      org_type: "product_supplier"
                    eaushadhi_warehouse_id: "99901000"
                    eaushadhi_warehouse_name: "Bokaro_DWH"
                    is_default: true
                    created_date: "2026-05-19 19:29:35.868682+05:30"
                  - id: "uuid2"
                    supplier:
                      id: "b1e7c2a4-9d8f-4e6b-a3c1-7f2d8e5b9c34"
                      name: "Apollo Pharmacy"
                      org_type: "product_supplier"
                    eaushadhi_warehouse_id: "99901001"
                    eaushadhi_warehouse_name: "Ranchi_DWH"
                    is_default: false
                    created_date: "2026-05-19 19:29:35.868682+05:30"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facility/{facility_external_id}/institute/{institute_id}/suppliers/{supplier_mapping_id}/:
    delete:
      tags:
        - Supplier Mappings
      summary: Remove supplier mapping
      description: Soft-delete a supplier mapping
      operationId: deleteSupplierMapping
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
        - name: supplier_mapping_id
          in: path
          required: true
          description: Supplier mapping UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier mapping deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Supplier mapping deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- Store Mappings ----------
  /facility/{facility_external_id}/institute/{institute_id}/stores/:
    post:
      tags:
        - Store Mappings
      summary: Add a store mapping
      description: |
        Add a store mapping to the institute.
        Maps a CARE store to a DVDMS store ID for indent/issue operations.
        At most one store can be marked as default.
      operationId: createStoreMapping
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreMappingCreate'
            example:
              store: "c2f8d3b5-ae90-4f7c-b401-8e3c9d6f1b25"
              eaushadhi_store_id: "99901002"
              eaushadhi_store_name: "CHC Pharmacy"
              is_default: true
      responses:
        '201':
          description: Store mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreMapping'
              example:
                id: "uuid1"
                store:
                  id: "c2f8d3b5-ae90-4f7c-b401-8e3c9d6f1b25"
                  name: "Counter 1"
                  form: "ro"
                eaushadhi_store_id: "99901002"
                eaushadhi_store_name: "CHC Pharmacy"
                is_default: true
                institute_id: "uuid"
                created_by:
                  id: "uuid"
                  username: "admin"
                  first_name: "Admin"
                  last_name: "User"
                  email: "admin@example.com"
                updated_by: null
                created_date: "2026-05-19 19:29:35.868682+05:30"
                modified_date: "2026-05-19 19:29:35.868682+05:30"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - store already mapped or multiple defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Store Mappings
      summary: List store mappings
      description: Get all store mappings for this institute
      operationId: listStoreMappings
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of store mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreMapping'
              example:
                count: 2
                results:
                  - id: "uuid1"
                    store:
                      id: "060d0e05-ffdc-446e-b844-d22cd6bced04"
                      name: "Counter 1"
                      form: "ro"
                    eaushadhi_store_id: "99901002"
                    eaushadhi_store_name: "CHC Pharmacy"
                    is_default: true
                    created_date: "2026-05-19 19:29:35.868682+05:30"
                  - id: "uuid2"
                    store:
                      id: "c2f8d3b5-ae90-4f7c-b401-8e3c9d6f1b25"
                      name: "Counter 2"
                      form: "ro"
                    eaushadhi_store_id: "99901003"
                    eaushadhi_store_name: "OPD Pharmacy"
                    is_default: false
                    created_date: "2026-05-19 19:29:35.868682+05:30"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /facility/{facility_external_id}/institute/{institute_id}/stores/{store_mapping_id}/:
    delete:
      tags:
        - Store Mappings
      summary: Remove store mapping
      description: Soft-delete a store mapping
      operationId: deleteStoreMapping
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
        - name: store_mapping_id
          in: path
          required: true
          description: Store mapping UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Store mapping deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Store mapping deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- DVDMS Lookups ----------
  /institute/{institute_id}/lookup/warehouses/:
    get:
      tags:
        - DVDMS Lookups
      summary: Lookup warehouses from DVDMS
      description: |
        Fetch the list of available warehouses directly from the DVDMS system
        for this institute.
        Uses the institute's credentials to query DVDMS API.
      operationId: getDvdmsWarehouses
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of DVDMS warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DvdmsWarehouse'
              example:
                - id: 99901062
                  name: "Chas_Chc"
                - id: 99901000
                  name: "JMHIDPCL"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Bad Gateway - Error communicating with DVDMS system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Failed to fetch warehouses from DVDMS"
                code: "DVDMS_API_ERROR"

  /institute/{institute_id}/lookup/stores/:
    get:
      tags:
        - DVDMS Lookups
      summary: Lookup stores from DVDMS
      description: |
        Fetch the list of available stores directly from the DVDMS system
        for this institute.
        Requires a fromStoreid query parameter to specify the source warehouse.
        Uses the institute's credentials to query DVDMS API.
      operationId: getDvdmsStores
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
        - name: fromStoreid
          in: query
          required: true
          description: DVDMS warehouse/from_store ID to fetch stores for
          schema:
            type: string
          example: "99901000"
      responses:
        '200':
          description: List of DVDMS stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DvdmsStore'
              example:
                - id: 99901062
                  name: "Chas_Chc"
                - id: 99901000
                  name: "JMHIDPCL"
        '400':
          description: Bad Request - fromStoreid is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "fromStoreid query parameter is required"
                code: "MISSING_PARAMETER"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Bad Gateway - Error communicating with DVDMS system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Failed to fetch stores from DVDMS"
                code: "DVDMS_API_ERROR"

  /institute/{institute_id}/lookup/drugs/:
    get:
      tags:
        - DVDMS Lookups
      summary: Lookup drugs from DVDMS
      description: |
        Fetch the list of available drugs/items directly from the DVDMS system
        for this institute.
        Supports filtering by group ID, subgroup ID, item category number, and item name.
        Uses the institute's credentials to query DVDMS API.
      operationId: getDvdmsDrugs
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
        - name: hstnum_group_id
          in: query
          required: false
          description: Filter by group ID
          schema:
            type: integer
          example: 101047
        - name: hstnum_subgroup_id
          in: query
          required: false
          description: Filter by subgroup ID
          schema:
            type: integer
          example: 0
        - name: sstnum_item_cat_no
          in: query
          required: false
          description: Filter by item category number
          schema:
            type: string
          example: "10"
        - name: hststr_item_name
          in: query
          required: false
          description: Filter by item name (partial match/search)
          schema:
            type: string
          example: "abc 500mg"
      responses:
        '200':
          description: List of DVDMS drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DvdmsDrug'
              example:
                - hstnum_item_id: 10002270
                  gnum_hospital_code: 998
                  hstnum_group_id: 101047
                  hstnum_subgroup_id: 0
                  sstnum_item_cat_no: "10"
                  hststr_item_name: "abc 500mg tablet(500mg ),Tablet"
                  hstnum_batchno_req: 1
                  hstnum_expirydate_req: 1
                  gnum_inventory_unitid: 630001
                  gdt_effective_frm: "Feb 11, 2025 12:00:00 AM"
                  gnum_lstmod_seatid: 0
                  gdt_entry_date: "Feb 11, 2025 11:31:54 AM"
                  gnum_seatid: 14462
                  gnum_isvalid: 1
                  hststr_cpa_code: "0"
                  hstnum_itembrand_id: 10103406
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Institute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Bad Gateway - Error communicating with DVDMS system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Failed to fetch drugs from DVDMS"
                code: "DVDMS_API_ERROR"

  /institute/{institute_id}/lookup/groups/:
    get:
      tags:
        - DVDMS Lookups
      summary: Lookup groups from DVDMS
      description: |
        Fetch the list of available drug groups directly from the DVDMS system
        for this institute.
        Uses the institute's credentials to query DVDMS API.
      operationId: getDvdmsGroups
      parameters:
        - name: institute_id
          in: path
          required: true
          description: Institute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of DVDMS drug groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DvdmsGroup'
              example:
                - gnumHospitalCode: 998
                  hstnumGroupId: 101038
                  hststrGroupName: "Anticonvulsants/Antiepileptics"
