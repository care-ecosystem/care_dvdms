components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    # Shared user object used in created_by / updated_by fields
    UserSummary:
      type: object
      required:
        - id
        - username
        - first_name
        - last_name
        - email
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        username:
          type: string
          example: "admin"
        first_name:
          type: string
          example: "Admin"
        last_name:
          type: string
          example: "User"
        email:
          type: string
          format: email
          example: "admin@example.com"

    # Shared supplier object used in supplier mappings
    SupplierSummary:
      type: object
      required:
        - id
        - name
        - org_type
      properties:
        id:
          type: string
          format: uuid
          example: "5aa85d4e-3456-41fb-aee2-8076f07cb91b"
        name:
          type: string
          example: "Medplus"
        org_type:
          type: string
          example: "product_supplier"

    # Shared store object used in store mappings
    StoreSummary:
      type: object
      required:
        - id
        - name
        - form
      properties:
        id:
          type: string
          format: uuid
          example: "060d0e05-ffdc-446e-b844-d22cd6bced04"
        name:
          type: string
          example: "Counter 1"
        form:
          type: string
          example: "ro"

    # Shared institute object used in record orders
    InstituteSummary:
      type: object
      required:
        - id
        - eaushadhi_institute_id
        - eaushadhi_institute_name
        - eaushadhi_user_ref_id
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        eaushadhi_institute_id:
          type: string
          example: "000931"
        eaushadhi_institute_name:
          type: string
          example: "CHC Bokaro"
        eaushadhi_user_ref_id:
          type: string
          example: "14462"

    # Shared institute supplier mapping object used in record orders
    InstituteSupplierSummary:
      type: object
      required:
        - id
        - eaushadhi_warehouse_id
        - eaushadhi_warehouse_name
        - supplier
      properties:
        id:
          type: string
          format: uuid
          description: Supplier mapping external_id
          example: "b1e7c2a4-9d8f-4e6b-a3c1-7f2d8e5b9c34"
        eaushadhi_warehouse_id:
          type: string
          description: DVDMS warehouse/from_store ID
          example: "99901000"
        eaushadhi_warehouse_name:
          type: string
          description: DVDMS warehouse name
          example: "Bokaro_DWH"
        supplier:
          $ref: '#/components/schemas/SupplierSummary'
          description: CARE supplier details

    # Shared institute store mapping object used in record orders
    InstituteStoreSummary:
      type: object
      required:
        - id
        - eaushadhi_store_id
        - eaushadhi_store_name
        - store
      properties:
        id:
          type: string
          format: uuid
          description: Store mapping external_id
          example: "c2f8d3b5-ae90-4f7c-b401-8e3c9d6f1b25"
        eaushadhi_store_id:
          type: string
          description: DVDMS store/to_store ID
          example: "99901002"
        eaushadhi_store_name:
          type: string
          description: DVDMS store name
          example: "CHC Pharmacy"
        store:
          $ref: '#/components/schemas/StoreSummary'
          description: CARE store details

    # Shared order object used in record orders
    OrderSummary:
      type: object
      required:
        - id
        - name
        - category
        - intent
        - priority
        - reason
        - status
        - created_date
        - modified_date
      properties:
        id:
          type: string
          format: uuid
          example: "4df37546-7b7b-4e5b-b135-9179838a6962"
        name:
          type: string
          example: "eaushadhi"
        category:
          type: string
          example: "central"
        intent:
          type: string
          example: "order"
        priority:
          type: string
          example: "routine"
        reason:
          type: string
          example: "patient_care"
        status:
          type: string
          example: "draft"
        note:
          type: string
          nullable: true
          example: ""
        tags:
          type: array
          items:
            type: string
          example: []
        origin:
          type: object
          nullable: true
          description: Origin facility details
          example: null
        destination:
          type: object
          description: Destination facility details
          properties:
            id:
              type: string
              format: uuid
              example: "4b16b242-984d-4702-8ffb-b68b27f5f310"
            status:
              type: string
              example: "active"
            operational_status:
              type: string
              example: "U"
        supplier:
          type: object
          description: Supplier details
          properties:
            id:
              type: string
              format: uuid
              example: "67be622b-6661-4968-94de-e29f74504dcf"
            active:
              type: boolean
              example: true
            org_type:
              type: string
              example: "product_supplier"
        created_by:
          $ref: '#/components/schemas/UserSummary'
        updated_by:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
        created_date:
          type: string
          format: date-time
          example: "2026-08-11T10:05:48.155327Z"
        modified_date:
          type: string
          format: date-time
          example: "2026-08-11T10:05:48.155343Z"

    # Institute Create Schema
    InstituteCreate:
      type: object
      required:
        - eaushadhi_institute_id
        - eaushadhi_institute_name
        - eaushadhi_user_ref_id
        - schema_version
      properties:
        eaushadhi_institute_id:
          type: string
          description: DVDMS/eAushadhi institute ID
          example: "000931"
        eaushadhi_institute_name:
          type: string
          description: DVDMS/eAushadhi institute name
          example: "CHC Bokaro"
        eaushadhi_user_ref_id:
          type: string
          description: |
            DVDMS/eAushadhi user reference ID (seat ID).
            This is the user ID used for authentication with the DVDMS API.
          example: "14462"
        schema_version:
          type: string
          description: Which API schema version applies to this facility's responses
          example: "1.0"
        meta:
          type: object
          nullable: true
          description: Arbitrary metadata (optional)
          example:
            setup_notes: "Configured during Phase 1"
            contact_person: "Dr. Kumar"

    # Institute Update Schema
    InstituteUpdate:
      type: object
      description: |
        All fields optional; only supplied fields are updated.
        facility_external_id and eaushadhi_institute_id cannot be changed (use delete + create instead).
      properties:
        eaushadhi_institute_name:
          type: string
          description: Update the institute name
          example: "CHC Bokaro Updated"
        eaushadhi_user_ref_id:
          type: string
          description: Update the user reference ID
          example: "14463"
        schema_version:
          type: string
          description: Update the schema version
          example: "2.0"
        meta:
          type: object
          nullable: true
          description: Update metadata
          example:
            last_sync: "2026-05-20T10:30:00Z"
            notes: "Updated after migration"

    # Institute Full Schema (Response)
    Institute:
      type: object
      required:
        - id
        - facility_id
        - eaushadhi_institute_id
        - eaushadhi_institute_name
        - eaushadhi_user_ref_id
        - schema_version
        - created_by
        - created_date
        - modified_date
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: External ID (primary key exposed via API)
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        facility_id:
          type: string
          format: uuid
          readOnly: true
          description: CARE facility external_id reference
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        eaushadhi_institute_id:
          type: string
          description: DVDMS/eAushadhi institute ID
          example: "000931"
        eaushadhi_institute_name:
          type: string
          description: DVDMS/eAushadhi institute name
          example: "CHC Bokaro"
        eaushadhi_user_ref_id:
          type: string
          description: DVDMS/eAushadhi user reference ID (seat ID)
          example: "14462"
        schema_version:
          type: string
          description: API schema version
          example: "1.0"
        meta:
          type: object
          nullable: true
          description: Arbitrary metadata
          example: null
        created_by:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: User who created this mapping
        updated_by:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          readOnly: true
          description: User who last updated this mapping (null if never updated)
        created_date:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when created
          example: "2026-05-19 19:29:35.868682+05:30"
        modified_date:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when last modified
          example: "2026-05-19 19:29:35.868682+05:30"

    # ===================== Supplier Mapping =====================
    SupplierMappingCreate:
      type: object
      required:
        - supplier
        - eaushadhi_warehouse_id
        - eaushadhi_warehouse_name
      properties:
        supplier:
          type: string
          format: uuid
          description: CARE supplier external_id (FK to organization with org_type='product_supplier')
          example: "b1e7c2a4-9d8f-4e6b-a3c1-7f2d8e5b9c34"
        eaushadhi_warehouse_id:
          type: string
          description: DVDMS warehouse/from_store ID
          example: "99901000"
        eaushadhi_warehouse_name:
          type: string
          description: DVDMS warehouse name (for matching inwards)
          example: "Bokaro_DWH"
        is_default:
          type: boolean
          default: false
          description: |
            Mark this supplier as default for unmapped warehouses.
            At most one supplier per institute can be default.
          example: true

    SupplierMapping:
      allOf:
        - $ref: '#/components/schemas/SupplierMappingCreate'
        - type: object
          required:
            - id
            - institute_id
            - created_by
            - created_date
            - modified_date
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Supplier mapping external_id (PK)
              example: "uuid"
            supplier:
              allOf:
                - $ref: '#/components/schemas/SupplierSummary'
              readOnly: true
              description: Supplier details (expanded in response)
            institute_id:
              type: string
              format: uuid
              readOnly: true
              description: FK to institute
              example: "uuid"
            created_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              readOnly: true
            updated_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              nullable: true
              readOnly: true
            created_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"
            modified_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"

    # ===================== Store Mapping =====================
    StoreMappingCreate:
      type: object
      required:
        - store
        - eaushadhi_store_id
        - eaushadhi_store_name
      properties:
        store:
          type: string
          format: uuid
          description: CARE store external_id
          example: "c2f8d3b5-ae90-4f7c-b401-8e3c9d6f1b25"
        eaushadhi_store_id:
          type: string
          description: DVDMS store/to_store ID
          example: "99901002"
        eaushadhi_store_name:
          type: string
          description: DVDMS store name (for display)
          example: "CHC Pharmacy"
        is_default:
          type: boolean
          default: false
          description: |
            Mark this store as default for indent/issue operations.
            At most one store per institute can be default.
          example: true

    StoreMapping:
      allOf:
        - $ref: '#/components/schemas/StoreMappingCreate'
        - type: object
          required:
            - id
            - institute_id
            - created_by
            - created_date
            - modified_date
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Store mapping external_id (PK)
              example: "uuid"
            store:
              allOf:
                - $ref: '#/components/schemas/StoreSummary'
              readOnly: true
              description: Store details (expanded in response)
            institute_id:
              type: string
              format: uuid
              readOnly: true
              description: FK to institute
              example: "uuid"
            created_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              readOnly: true
            updated_by:
              allOf:
                - $ref: '#/components/schemas/UserSummary'
              nullable: true
              readOnly: true
            created_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"
            modified_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-05-19 19:29:35.868682+05:30"

    # ===================== DVDMS Lookup Schemas =====================
    DvdmsWarehouse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: DVDMS warehouse ID
          example: 99901062
        name:
