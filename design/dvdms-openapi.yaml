      parameters:
        - name: facility_id
          in: path
          required: true
          description: Facility UUID
          schema:
            type: string
            format: uuid
        - name: destination_id
          in: path
          required: true
          description: Destination facility UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Number of results to return per page
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          description: The initial index from which to return the results
          schema:
            type: integer
            default: 0
        - name: record_order
          in: query
          required: false
          description: Filter by record order UUID
          schema:
